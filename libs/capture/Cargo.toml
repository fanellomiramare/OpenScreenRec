[package]
name = "osr-capture"
description = "Screen and window capture for OpenScreenRec: FrameSource trait + per-OS backends."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
osr-common = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.14"
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
pipewire = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "net"] }
