name: Release

# Triggered when release-plz publishes a GitHub Release (see release-plz.yml).
# Builds release binaries for every platform and attaches them to the release.
#
# macOS ships a proper .app bundle inside a .dmg. Without the signing
# secrets the bundle is ad-hoc signed (works, Gatekeeper asks for a
# one-time approval — see docs/MACOS.md); with the optional
# self-signed-certificate secrets the signature stays stable across
# releases, so TCC permissions survive updates.
# Native installers for Windows (.exe) and Linux (AppImage/deb/rpm) land with M5.

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  artifacts:
    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: openscreenrec-windows-x64
            binary: openscreenrec.exe
            ext: .zip
          - os: macos-latest
            artifact-name: openscreenrec-macos-arm64
            binary: openscreenrec
            ext: .dmg
          - os: macos-13
            artifact-name: openscreenrec-macos-x64
            binary: openscreenrec
            ext: .dmg
          - os: ubuntu-latest
            artifact-name: openscreenrec-linux-x64
            binary: openscreenrec
            ext: .tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libpulse-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Package (Windows — portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/${{ matrix.artifact-name }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" $dir/
          Copy-Item README.md, LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "${{ matrix.artifact-name }}.zip"

      - name: Package (Windows — NSIS installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem target/release/*.exe | ForEach-Object { Write-Output "exe: $($_.FullName)" }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DAPP_VERSION=$version" `
            "/DEXE_PATH=${{ github.workspace }}\target\release\${{ matrix.binary }}" `
            "/DLICENSE_PATH=${{ github.workspace }}\LICENSE" "/DREADME_PATH=${{ github.workspace }}\README.md" `
            "/DOUT_DIR=${{ github.workspace }}\dist" "${{ github.workspace }}\packaging\windows.nsi"

      - name: Package (macOS — .app bundle + .dmg)
        if: runner.os == 'MacOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          APP="OpenScreenRec.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OpenScreenRec</string>
            <key>CFBundleDisplayName</key><string>OpenScreenRec</string>
            <key>CFBundleIdentifier</key><string>com.fanellomiramare.openscreenrec</string>
            <key>CFBundleExecutable</key><string>OpenScreenRec</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.3</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSScreenCaptureUsageDescription</key><string>OpenScreenRec needs screen recording permission to capture your screen.</string>
            <key>NSMicrophoneUsageDescription</key><string>OpenScreenRec records your microphone when you enable it.</string>
          </dict>
          </plist>
          PLIST
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cp "target/release/${{ matrix.binary }}" "$APP/Contents/MacOS/OpenScreenRec"

          # Stable self-signed certificate when the secrets exist (TCC
          # permissions survive updates); ad-hoc otherwise (docs/MACOS.md).
          if [ -n "$MACOS_CERT_P12" ]; then
            echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
            security create-keychain -p osr-temp build.keychain
            security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k osr-temp build.keychain
            codesign --force --sign "$MACOS_CERT_IDENTITY" "$APP"
            security delete-keychain build.keychain
            rm cert.p12
          else
            codesign --force --sign - "$APP"
          fi

          mkdir -p dist
          cp -R "$APP" dist/
          cp README.md LICENSE dist/
          hdiutil create -volname OpenScreenRec -srcfolder dist -ov -format UDZO \
            "${{ matrix.artifact-name }}.dmg"

          # Homebrew cask maintenance (packaging/openscreenrec.rb):
          # print the checksum for the tap update after each release.
          echo "sha256 (${{ matrix.artifact-name }}.dmg):" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 "${{ matrix.artifact-name }}.dmg" >> "$GITHUB_STEP_SUMMARY"

      - name: Package (Linux — tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/${{ matrix.artifact-name }}
          cp target/release/${{ matrix.binary }} dist/${{ matrix.artifact-name }}/
          cp README.md LICENSE dist/${{ matrix.artifact-name }}/
          tar -czf ${{ matrix.artifact-name }}.tar.gz -C dist ${{ matrix.artifact-name }}

      - name: Package (Linux — deb)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps
          cat > deb/DEBIAN/control <<CTL
          Package: openscreenrec
          Version: $VERSION
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: fanellomiramare <fanellomiramare@users.noreply.github.com>
          Depends: libpulse0, libasound2 | libasound2t64, libpipewire-0.3-0
          Recommends: ffmpeg
          Description: Free and open-source screen recorder
           100% Rust, cross-platform screen recorder. Encoding is done by an
           external FFmpeg binary.
          CTL
          cp target/release/openscreenrec deb/usr/bin/
          cp packaging/openscreenrec.desktop deb/usr/share/applications/
          cp assets/icon-256.png deb/usr/share/icons/hicolor/256x256/apps/openscreenrec.png
          dpkg-deb --build deb openscreenrec-linux-x64.deb

      - name: Package (Linux — rpm)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
          mv target/generate-rpm/openscreenrec-*.rpm openscreenrec-linux-x64.rpm

      - name: Package (Linux — AppImage)
        if: runner.os == 'Linux'
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp target/release/openscreenrec AppDir/usr/bin/
          cp packaging/openscreenrec.desktop AppDir/usr/share/applications/
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp assets/icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/openscreenrec.png
          cp assets/icon-256.png AppDir/openscreenrec.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          # Populate the AppDir, fix permissions, then build the image in a
          # separate step — linuxdeploy's internal appimagetool chokes on
          # AppRun permissions on CI runners.
          ./linuxdeploy-x86_64.AppImage --appdir AppDir
          chmod -R a+rX AppDir
          ./appimagetool-x86_64.AppImage AppDir openscreenrec-linux-x64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact-name }}${{ matrix.ext }}
            dist/openscreenrec-setup.exe
            openscreenrec-linux-x64.AppImage
            openscreenrec-linux-x64.deb
            openscreenrec-linux-x64.rpm
